services:
  - type: web
    name: uno3d-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: TRTC_SDKAPPID
        sync: false
      - key: TRTC_SECRETKEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
